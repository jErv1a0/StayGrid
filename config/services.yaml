# config/services.yaml

parameters:
    rooms_images_directory: '%kernel.project_dir%/public/uploads/rooms'
    # Define the parameter name and its absolute path value
    profile_pictures_directory: '%kernel.project_dir%/public/uploads/profile_pictures'
    app_secret_fallback: 'staygrid-default-secret'
    mailer_fallback_dsn: 'null://null'

services:

    _defaults:
        autowire: true      
        autoconfigure: true 
        # CRITICAL FIX: Use bind to map the parameter name to the controller argument
        bind:
            $profilePictureDirectory: '%profile_pictures_directory%'
            $kernelSecret: '%kernel.secret%'

    App\:
        resource: '../src/'
        exclude: '../src/{Command/Deployment,DataFixtures,DependencyInjection,Entity,Migrations,Tests,Kernel.php}'

    # The explicit App\Controller\User\ProfileController block is NOT needed when using bind.

    # Ensure our activity subscriber is kept as a runtime service and not inlined away
    App\EventSubscriber\UserActivitySubscriber:
        public: true
        tags:
            - { name: 'kernel.event_subscriber' }
            - { name: 'security.event_subscriber', dispatcher: 'main' }
            - { name: 'security.event_subscriber', dispatcher: 'admin' }

    # Explicitly register SafeUrlExtension to expose safe_path() to Twig
    App\Twig\SafeUrlExtension:
        tags: ['twig.extension']
        public: false

    App\Security\EmailVerifier:
        public: true

    # Configure a dedicated Guzzle client for KnpU OAuth2 in local dev (non-prod only).
    knpu.oauth2.guzzle:
        class: GuzzleHttp\Client
        arguments:
            - {
                timeout: 30,
                verify: false,
              }
        public: false

when@dev:
    services:
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
            tags: ['doctrine.fixture.orm']
            autowire: true
            autoconfigure: true

when@test:
    services:
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
            tags: ['doctrine.fixture.orm']
            autowire: true
            autoconfigure: true

when@prod:
    services:
        App\Command\Deployment\MakeMigrationCommand:
            tags: ['console.command']