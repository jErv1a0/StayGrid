# config/packages/security.yaml

security:

    role_hierarchy:
        ROLE_ADMIN: [ROLE_CLIENT, ROLE_STAFF]
        ROLE_STAFF: [ROLE_CLIENT]
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    providers:
        app_user_provider:
            entity:
                class: App\Entity\LogInUsers
                property: email

    password_hashers:
        App\Entity\LogInUsers:
            algorithm: auto
        App\Entity\User:
            algorithm: auto

    firewalls:

        dev:
            pattern: ^/(_(profiler|wdt))
            security: false

        # API firewall - token-based stateless authentication for API clients
        api:
            pattern: ^/api
            lazy: true
            provider: app_user_provider
            context: app_shared_session
            user_checker: App\Security\UserChecker
            custom_authenticators:
                - App\Security\ApiTokenAuthenticator
            entry_point: App\Security\ApiTokenAuthenticator

        # ---------- ADMIN FIREWALL ----------
        admin:
            pattern: ^/admin
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_admin_login
                check_path: app_admin_login
                default_target_path: app_admin_home 
                csrf_token_id: admin_authenticate
            logout:
                path: app_admin_logout
                target: app_admin_login
            
            # --- FEATURE: Remember Me for Admin Firewall ---
            remember_me:
                secret: '%kernel.secret%'
                user_provider: app_user_provider 
                name: _admin_remember_me 
                lifetime: 2592000
                path: /admin 

        # ---------- MAIN FIREWALL (Client/Standard User) ----------
        main:
            lazy: true
            provider: app_user_provider
            context: app_shared_session
            user_checker: App\Security\UserChecker
            entry_point: form_login
            custom_authenticators:
                - App\Security\GoogleAuthenticator
            form_login:
                login_path: app_login
                check_path: app_login
                default_target_path: app_user_dashboard
                csrf_token_id: authenticate 
            logout:
                path: app_logout
                target: app_landing

            remember_me:
                secret: '%kernel.secret%'
                user_provider: app_user_provider 
                name: _remember_me 
                lifetime: 2592000 
                path: / 

    access_control:

        - { path: ^/admin/login$, roles: PUBLIC_ACCESS }
        - { path: ^/staff/roomlisting/bookings, roles: PUBLIC_ACCESS }
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google/mobile$, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/google$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/auth/verify-email$, roles: PUBLIC_ACCESS }
        - { path: ^/api/rooms, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - { path: ^/admin, roles: ROLE_ADMIN }

        - { path: ^/user/feedback$, roles: PUBLIC_ACCESS }

        - { path: ^/user, roles: [ROLE_CLIENT, ROLE_STAFF] }
        
        - { path: ^/(login|logout|about|contact)/, roles: PUBLIC_ACCESS }
        - { path: ^/$, roles: PUBLIC_ACCESS }

        - { path: ^/client, roles: ROLE_CLIENT }