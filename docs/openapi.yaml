openapi: 3.0.3
info:
  title: StayGrid Mobile API
  version: 1.0.0
  description: Mobile-ready JSON API for the StayGrid backend using bearer tokens.
servers:
  - url: http://localhost:8000
  - url: https://{host}
    variables:
      host:
        default: YOUR_HOST
paths:
  /api/auth/login:
    post:
      summary: Login and receive a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthLoginResponse'
        '401':
          description: Invalid credentials
        '403':
          description: Email not verified
  /api/auth/me:
    get:
      summary: Get the current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized
  /api/user/profile:
    get:
      summary: Alias for current authenticated user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMeResponse'
        '401':
          description: Unauthorized
  /api/auth/logout:
    post:
      summary: Logout client-side by discarding the token
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out
  /api/rooms:
    get:
      summary: List rooms
      responses:
        '200':
          description: Rooms collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoomsResponse'
  /api/bookings/my:
    get:
      summary: List the current user's bookings
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Bookings collection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingsResponse'
        '401':
          description: Unauthorized
  /api/bookings:
    post:
      summary: Create a booking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewBookingRequest'
      responses:
        '201':
          description: Booking created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingCreateResponse'
        '400':
          description: Invalid booking payload
        '401':
          description: Unauthorized
        '409':
          description: Booking conflict
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    AuthLoginResponse:
      type: object
      properties:
        success:
          type: boolean
        token_type:
          type: string
          example: Bearer
        access_token:
          type: string
        expires_in:
          type: integer
        user:
          $ref: '#/components/schemas/UserSummary'
    AuthMeResponse:
      type: object
      properties:
        success:
          type: boolean
        user:
          $ref: '#/components/schemas/UserProfile'
    RoomsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Room'
    BookingsResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
    NewBookingRequest:
      type: object
      required: [roomId, startDate, endDate]
      properties:
        roomId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        guests:
          type: integer
    BookingCreateResponse:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Booking'
    Room:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
        category:
          type: string
        description:
          type: string
        capacity:
          type: integer
        pricePerNight:
          type: number
        isAvailable:
          type: boolean
        location:
          type: string
        isBlocked:
          type: boolean
    Booking:
      type: object
      properties:
        id:
          type: integer
        roomId:
          type: integer
        userId:
          type: integer
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
        status:
          type: string
        bookingType:
          type: string
    UserSummary:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        fullName:
          type: string
    UserProfile:
      allOf:
        - $ref: '#/components/schemas/UserSummary'
        - type: object
          properties:
            phoneNumber:
              type: string
            address:
              type: string
            birthday:
              type: string
              format: date
            roles:
              type: array
              items:
                type: string
            isVerified:
              type: boolean